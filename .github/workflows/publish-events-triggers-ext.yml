name: Publish Events Triggers Extension

# Publishes greentic.events-triggers (.gtxpack) on `events-triggers-ext-v*` tag pushes.
# Tag pattern is distinct from `webhook-ext-v*` (webhook), `ext-v*` (http), and
# `platform-ext-v*` (platform-bootstrap) so each extension in the repo can ship
# independently. Version published = tag name with the leading
# `events-triggers-ext-v` stripped.

on:
  push:
    tags: ['events-triggers-ext-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version to publish (must match describe.json)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#events-triggers-ext-v}"
          fi
          echo "==> Publishing greentic.events-triggers@${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: greenticai/greentic-designer-extension-action@v2
        with:
          # Pre-release pin for the contract 1.2.x line — exact version
          # required so cargo accepts the `-research` prerelease suffix.
          gtdx-version: "=1.2.6-research"
          manifest: extensions/events-triggers-ext/Cargo.toml
          store-url: ${{ vars.GREENTIC_STORE_URL }}
          store-token: ${{ secrets.GREENTIC_STORE_TOKEN }}
          version: ${{ steps.ver.outputs.version }}
