name: Publish Done Extension

# Publishes greentic.done (.gtxpack) on `done-ext-v*` tag pushes.
# The tag pattern is distinct from the other extensions in the repo so each can
# ship independently. Version published = tag name with the leading
# `done-ext-v` stripped.

on:
  push:
    tags: ['done-ext-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version to publish (must match describe.json)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#done-ext-v}"
          fi
          echo "==> Publishing greentic.done@${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: greenticai/greentic-designer-extension-action@v2
        with:
          manifest: crates/done-extension/Cargo.toml
          store-url: ${{ vars.GREENTIC_STORE_URL }}
          store-token: ${{ secrets.GREENTIC_STORE_TOKEN }}
          version: ${{ steps.ver.outputs.version }}
# BEFORE the first tag: publish component-done to OCI and pin its digest in
# crates/done-extension/describe.json (runtime.components.done-node). The node
# types resolve that component by digest; with the placeholder in place the
# steps cannot run. build.sh refuses RELEASE=1 until it is filled.
