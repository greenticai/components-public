name: Publish component-events2msg

# Publishes ghcr.io/greenticai/component/component-events2msg on `component-events2msg-v*` tag pushes.
# Tag pattern is distinct so this component ships independently from the
# others under crates/. Version published = tag name with the leading
# `component-events2msg-v` stripped (must match Cargo.toml). Mirrors publish-component-http.yml.

on:
  push:
    tags: ['component-events2msg-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Component version (must match Cargo.toml)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#component-events2msg-v}"
          fi
          echo "==> Publishing component-events2msg@${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install cargo-component
        run: cargo install cargo-component --version 0.21.1 --locked

      - name: Build component
        run: cargo component build -p component-events2msg --release --target wasm32-wasip2 --locked

      - name: Setup oras
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push component to OCI
        run: |
          set -euo pipefail
          ARTIFACT="target/wasm32-wasip2/release/component_events2msg.wasm"
          test -f "$ARTIFACT"
          oras push \
            "ghcr.io/greenticai/component/component-events2msg:${{ steps.ver.outputs.version }}" \
            "${ARTIFACT}:application/wasm"

      - name: Verify push by pulling back
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          oras pull "ghcr.io/greenticai/component/component-events2msg:${{ steps.ver.outputs.version }}" -o /tmp/verify
          WASM=$(find /tmp/verify -name component_events2msg.wasm | head -1); test -n "$WASM" && test -f "$WASM"
