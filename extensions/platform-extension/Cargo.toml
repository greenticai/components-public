[package]
name = "platform-extension"
version = "1.2.2-research"
edition = "2024"
license = "MIT"
authors = [
    "Greentic",
]
description = "Greentic platform-bootstrap design extension. Ships the start nodeType — the only structural primitive the platform itself owns. Webhook trigger moved to greentic.webhook in 0.2.0; the generic LLM nodeType moved to greentic.llm-generic in 0.3.0."

[package.metadata.component]
package = "greentic:platform"

[package.metadata.component.target]
path = "wit"

[package.metadata.component.target.dependencies."greentic:extension-base"]
path = "wit/deps/greentic/extension-base"

[package.metadata.component.target.dependencies."greentic:extension-host"]
path = "wit/deps/greentic/extension-host"

[package.metadata.component.target.dependencies."greentic:extension-design"]
path = "wit/deps/greentic/extension-design"

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[dependencies]
serde_json = "1"

[dependencies.wit-bindgen-rt]
version = "0.35"
features = [
    "bitflags",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]
