[package]
name = "done-extension"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Greentic"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt.workspace = true
serde.workspace = true
serde_json.workspace = true
# The same operations the flow nodes run, used as a library: one definition of
# what "create a Done request" means, whether a worker calls it as a tool or a
# flow runs it as a node. `host` stays off so the node component's imports do
# not leak into this wasm.
component-done = { path = "../component-done", default-features = false }
getrandom = "0.3"

[package.metadata.component]
package = "greentic:done"

[package.metadata.component.target]
path = "wit"

[package.metadata.component.target.dependencies]
"greentic:extension-base" = { path = "wit/deps/greentic/extension-base" }
"greentic:extension-host" = { path = "wit/deps/greentic/extension-host" }
"greentic:extension-design" = { path = "wit/deps/greentic/extension-design" }

[dev-dependencies]
# The typed reader every designer uses. It is `deny_unknown_fields` from the
# root down, so parsing describe.json with it is the real "will it load" check.
greentic-extension-sdk-contract = "1.2.25"
