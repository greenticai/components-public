[package]
name = "component-done"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Done @ Greentic component (done-ops): create and read Done requests from a flow"
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component-v0-v6-v0@0.6.0"

[dependencies]
serde.workspace = true
serde_json.workspace = true
greentic-types.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
greentic-interfaces-guest = { workspace = true, optional = true, features = [
    "component-v0-6",
    "http-client-v1-1",
    "secrets",
] }
wit-bindgen = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }

[features]
default = ["host"]
# The flow-node wasm component. The design extension reuses `ops` as a plain
# library and turns this off, so the component-model imports of this crate do
# not leak into the extension's wasm.
host = ["dep:greentic-interfaces-guest", "dep:wit-bindgen", "dep:getrandom"]
