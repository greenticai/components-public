[package]
name = "component-twilio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Twilio component for Greentic flows"
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component-v0-v6-v0@0.6.0"

[dependencies]
serde.workspace = true
serde_json.workspace = true
greentic-types.workspace = true
# Used by `input.rs`, which is the extension's module verbatim — Twilio's
# Messages API takes a form-encoded body, not JSON.
form_urlencoded = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
greentic-interfaces-guest = { workspace = true, features = [
    "component-v0-6",
    "http-client-v1-1",
    "secrets",
] }
wit-bindgen.workspace = true
