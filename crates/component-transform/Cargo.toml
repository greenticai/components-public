[package]
name = "component-transform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure-JSON transform component for Greentic flows (json_pick)"
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component-v0-v6-v0@0.6.0"

[features]
# Off by default, and there is currently NO dependency behind it. `jsonpath_lib`
# — the only crate that implements what `query_jsonpath` / `json_reshape` need —
# enables `serde_json/preserve_order` transitively, and cargo unifies features
# across this workspace, so adding it changes the JSON key order every component
# here emits. The flag exists so the two functions and their tests stay in the
# tree, compiled out, until that is solved deliberately.
jsonpath = []

[dependencies]
serde.workspace = true
# NOT `preserve_order`. The design extension enables it in its own workspace,
# but cargo unifies features across THIS one, so turning it on here silently
# changes the JSON key order every other component in the repo emits — it broke
# component-chat2data-translator's tests the moment it was added. Key order in a
# JSON object is insignificant (RFC 8259) and nothing in a flow reads a value
# positionally, so the cost of not having it is a serialization detail; the cost
# of having it is a workspace-wide behaviour change nobody asked for.
serde_json.workspace = true
greentic-types.workspace = true
# Same three libraries the design extension uses, at the same majors, because the
# pure logic modules below are ITS modules copied verbatim — a different
# jsonschema or json-patch here would make the node and the tool disagree about
# what an operation does.
jsonschema = { version = "0.18", default-features = false }
json-patch = { version = "2", default-features = false, features = ["diff"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
greentic-interfaces-guest = { workspace = true, features = ["component-v0-6"] }
wit-bindgen.workspace = true
