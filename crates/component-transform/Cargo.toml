[package]
name = "component-transform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure-JSON transform component for Greentic flows (json_pick)"
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component-v0-v6-v0@0.6.0"

[dependencies]
serde.workspace = true
# preserve_order (IndexMap) is REQUIRED: `json_pick`'s contract is that output
# key order follows `keys`, which a hash-ordered map cannot honour.
serde_json = { version = "1", features = ["preserve_order"] }
greentic-types.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
greentic-interfaces-guest = { workspace = true, features = ["component-v0-6"] }
wit-bindgen.workspace = true
